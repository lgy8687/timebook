<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>并行活动原型</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; }
  .drawer-up { animation: slideUp .3s ease-out; }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .fade-in { animation: fadeIn .15s ease-out; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .swipe-card { transition: transform .2s cubic-bezier(.34,1.56,.64,1); will-change: transform; }
  .swipe-card.swiping { transition: none !important; }
  .toast { animation: toastUp .3s ease-out, toastOut .3s ease-in 1.7s forwards; }
  @keyframes toastUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @keyframes toastOut { to { transform: translateY(20px); opacity: 0; } }
</style>
</head>
<body class="bg-slate-50 text-slate-900 h-screen flex flex-col overflow-hidden select-none">

  <!-- 顶部状态 -->
  <header class="bg-white px-4 py-3 border-b border-slate-100 flex items-center justify-between shrink-0 shadow-sm">
    <div class="flex items-center gap-2">
      <span class="w-2.5 h-2.5 rounded-full bg-green-400"></span>
      <span class="text-[9px] text-indigo-500 font-black uppercase tracking-widest">Proto · 并行</span>
    </div>
    <span class="text-lg font-mono font-black text-indigo-600">01:23:45</span>
  </header>

  <!-- 内容区 -->
    <main class="flex-1 overflow-y-auto p-4">
    <div class="max-w-md mx-auto space-y-3">

      <div class="text-[10px] font-black text-slate-300 uppercase tracking-widest px-1 py-2 border-b border-slate-100">📋 今日流水</div>

      <!-- 单一条目 + 并行子条目容器 -->
      <div id="log-group">
        <!-- 主卡片 -->
        <div id="log-row" class="relative overflow-hidden rounded-2xl mb-1">
          <div id="log-card" class="swipe-card relative z-10 bg-white rounded-2xl border border-slate-50 shadow-sm p-4 flex items-center gap-3 cursor-pointer">
            <div class="w-1.5 h-10 rounded-full shrink-0" style="background:#3b82f6"></div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center text-xs text-slate-400 font-bold">
                <span class="font-mono shrink-0">08:30</span>
                <span class="flex-1 font-black text-slate-700 truncate ml-2">💼 上班 / 办公</span>
                <span class="text-indigo-500 font-black shrink-0">175min</span>
              </div>
              <div class="text-sm text-slate-400 italic truncate mt-0.5">写周报</div>
            </div>
            <span id="parallel-count" class="hidden text-[9px] font-black text-violet-500 bg-violet-50 rounded-full px-2 py-0.5 shrink-0">⏎ 0</span>
          </div>
        </div>

        <!-- 并行子条目渲染区 -->
        <div id="parallel-children" class="ml-5 pl-3 border-l-2 border-dashed border-slate-200 space-y-1.5"></div>
      </div>

      <div class="text-center text-[10px] text-slate-300 font-bold py-1">
        ← 左滑删除 · 右滑修改 · 点卡片加并行 →
      </div>

      <!-- 说明 -->
      <div class="bg-white rounded-2xl border border-slate-50 p-4 text-xs text-slate-400 space-y-2">
        <div class="font-black text-slate-500 text-sm">💡 操作说明</div>
        <div>🟢 <b>点卡片</b> → 弹出并行抽屉（实时记录）</div>
        <div>🟠 <b>长按卡片</b> → 弹出并行抽屉（补录模式·带时间选择）</div>
        <div>⬅️ <b>左滑</b> → 删除</div>
        <div>➡️ <b>右滑</b> → 修改</div>
      </div>

    </div>
  </main>

  <!-- 底部占位 -->
  <div class="h-8 shrink-0"></div>

  <!-- ============ 抽屉 ============ -->
  <div id="drawer-overlay" class="hidden fixed inset-0 bg-slate-900/30 z-50 backdrop-blur-sm fade-in" onclick="closeDrawer()"></div>
  <div id="drawer" class="hidden fixed bottom-0 left-0 right-0 z-50">
    <div class="bg-white rounded-t-[32px] drawer-up max-h-[75vh] flex flex-col shadow-xl">

      <!-- 头部 -->
      <div class="flex items-center justify-between px-6 pt-5 pb-3 shrink-0">
        <div>
          <span id="drawer-mode-tag" class="text-[9px] font-black text-violet-500 bg-violet-50 rounded-full px-2 py-0.5">⚡ 实时</span>
          <h2 id="drawer-title" class="text-base font-black mt-1">➕ 添加并行活动</h2>
          <p id="drawer-sub" class="text-[10px] text-slate-400 mt-0.5">并行于 <b id="parent-name">💼 上班 / 办公</b></p>
        </div>
        <button onclick="closeDrawer()" class="text-slate-300 text-xl leading-none p-2">✕</button>
      </div>

      <!-- 时间栏（补录模式显示） -->
      <div id="time-bar" class="hidden mx-6 mb-3 p-3 bg-slate-50 rounded-2xl border border-slate-100">
        <div class="flex items-center gap-3">
          <div class="flex-1 flex items-center gap-1.5">
            <span class="text-[10px] font-bold text-slate-400 shrink-0">开始</span>
            <input type="time" id="parallel-start" value="12:00" class="flex-1 bg-white border border-slate-200 rounded-xl px-3 py-2 text-sm font-mono font-bold text-slate-700 focus:outline-none focus:border-indigo-400">
          </div>
          <div class="flex items-center gap-1.5">
            <span class="text-[10px] font-bold text-slate-400 shrink-0">时长</span>
            <input type="number" id="parallel-dur" value="30" min="1" step="5" class="w-16 bg-white border border-slate-200 rounded-xl px-3 py-2 text-sm font-mono font-bold text-slate-700 text-center focus:outline-none focus:border-indigo-400">
            <span class="text-[10px] text-slate-400 font-bold">分</span>
          </div>
        </div>
      </div>

      <!-- 分类选择 -->
      <div class="flex-1 overflow-hidden flex flex-col px-6 pb-4">
        <!-- 视图切换 -->
        <div class="flex gap-1 mb-3 shrink-0">
          <button id="view-columns" class="view-btn text-[10px] font-black px-3 py-1.5 rounded-full bg-indigo-600 text-white">左右</button>
          <button id="view-flat" class="view-btn text-[10px] font-black px-3 py-1.5 rounded-full bg-slate-100 text-slate-400">铺满</button>
          <button id="view-stacked" class="view-btn text-[10px] font-black px-3 py-1.5 rounded-full bg-slate-100 text-slate-400">堆叠</button>
        </div>

        <!-- 列模式 -->
        <div id="view-columns-content" class="flex gap-3 flex-1 min-h-0 overflow-hidden">
          <div id="col-l1" class="w-1/3 overflow-y-auto space-y-1"></div>
          <div id="col-l2" class="w-2/3 overflow-y-auto grid grid-cols-2 gap-2"></div>
        </div>
        <!-- 铺满模式 -->
        <div id="view-flat-content" class="hidden flex-1 overflow-y-auto grid grid-cols-2 gap-2"></div>
        <!-- 堆叠模式 -->
        <div id="view-stacked-content" class="hidden flex-1 overflow-y-auto space-y-3"></div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="hidden fixed bottom-24 left-1/2 -translate-x-1/2 z-[60] toast bg-slate-900 text-white text-sm font-bold px-5 py-3 rounded-2xl shadow-lg"></div>

  <script>
    // --- 数据 ---
    const cats = [
      { id: 1, name: "上班", icon: "💼", color: "#3b82f6", subs: ["开网约车", "开会", "写代码", "办公"] },
      { id: 2, name: "生活", icon: "🏠", color: "#f59e0b", subs: ["睡觉", "洗漱", "休息"] },
      { id: 3, name: "餐饮", icon: "🍱", color: "#10b981", subs: ["早午晚餐", "零食"] },
      { id: 4, name: "交通", icon: "🚗", color: "#ef4444", subs: ["开车", "加油"] },
    ];
    let parentCard = { l1: "上班", l2: "办公" };
    let currentView = 'columns';
    let isLongPress = false;
    let longPressTimer = null;

    // --- 分类渲染 ---
    function renderCats(mode) {
      ['columns','flat','stacked'].forEach(v => {
        document.getElementById('view-'+v+'-content').classList.toggle('hidden', v !== mode);
      });
      document.querySelectorAll('.view-btn').forEach(b => {
        b.classList.toggle('bg-indigo-600', b.id === 'view-'+mode);
        b.classList.toggle('text-white', b.id === 'view-'+mode);
        b.classList.toggle('bg-slate-100', b.id !== 'view-'+mode);
        b.classList.toggle('text-slate-400', b.id !== 'view-'+mode);
      });
      currentView = mode;

      if (mode === 'columns') {
        const l1Box = document.getElementById('col-l1');
        const l2Box = document.getElementById('col-l2');
        l1Box.innerHTML = '';
        cats.forEach(c => {
          const btn = document.createElement('button');
          btn.className = 'w-full text-left px-3 py-2 rounded-xl text-xs font-bold transition-colors ' + (c.name === selL1 ? 'bg-indigo-100 text-indigo-700' : 'text-slate-500 hover:bg-slate-100');
          btn.innerText = c.icon + ' ' + c.name;
          btn.onclick = () => { selL1 = c.name; renderCats('columns'); };
          l1Box.appendChild(btn);
        });
        l2Box.innerHTML = '';
        const c = cats.find(x => x.name === selL1) || cats[0];
        if (c) c.subs.forEach(s => {
          const btn = document.createElement('button');
          btn.className = 'bg-slate-50 rounded-xl p-3 text-center text-xs font-bold text-slate-700 cursor-pointer transition-all active:scale-95 hover:bg-indigo-50';
          btn.innerText = getSubIcon(s, c.icon) + '\n' + s;
          btn.onclick = () => pickCategory(c.name, s);
          l2Box.appendChild(btn);
        });
      } else if (mode === 'flat') {
        const box = document.getElementById('view-flat-content');
        box.innerHTML = '';
        cats.forEach(c => {
          c.subs.forEach(s => {
            const btn = document.createElement('button');
            btn.className = 'bg-slate-50 rounded-xl p-3 text-center text-xs font-bold text-slate-700 cursor-pointer transition-all active:scale-95';
            btn.innerText = getSubIcon(s, c.icon) + '\n' + s;
            btn.onclick = () => pickCategory(c.name, s);
            box.appendChild(btn);
          });
        });
        // 父分类快捷
        cats.forEach(c => {
          const btn = document.createElement('button');
          btn.className = 'bg-indigo-50 rounded-xl p-3 text-center text-xs font-bold text-indigo-600 cursor-pointer transition-all active:scale-95';
          btn.innerText = c.icon + ' ' + c.name;
          btn.onclick = () => pickCategory(c.name, '');
          box.appendChild(btn);
        });
      } else if (mode === 'stacked') {
        const box = document.getElementById('view-stacked-content');
        box.innerHTML = '';
        cats.forEach(c => {
          const wrap = document.createElement('div');
          wrap.className = 'bg-white border border-slate-100 rounded-2xl p-3';
          const head = document.createElement('div');
          head.className = 'flex items-center justify-between mb-2';
          head.innerHTML = '<span class="text-sm font-black text-slate-700">' + c.icon + ' ' + c.name + '</span>';
          const direct = document.createElement('button');
          direct.className = 'text-[10px] font-black text-indigo-500 bg-indigo-50 rounded-full px-2.5 py-1';
          direct.innerText = '记一笔';
          direct.onclick = () => pickCategory(c.name, '');
          head.appendChild(direct);
          wrap.appendChild(head);
          const grid = document.createElement('div');
          grid.className = 'grid grid-cols-4 gap-2';
          c.subs.forEach(s => {
            const btn = document.createElement('button');
            btn.className = 'bg-slate-50 rounded-xl py-2 text-center text-[10px] font-bold text-slate-600 cursor-pointer active:scale-95';
            btn.innerHTML = getSubIcon(s, c.icon) + '<br>' + s;
            btn.onclick = () => pickCategory(c.name, s);
            grid.appendChild(btn);
          });
          wrap.appendChild(grid);
          box.appendChild(wrap);
        });
      }
    }

    function getSubIcon(name, parentIcon) {
      const map = { '开网约车':'🚕','开会':'📋','写代码':'💻','办公':'📝','睡觉':'😴','洗漱':'🧴','休息':'☕','早午晚餐':'🍽️','零食':'🍪','开车':'🚗','加油':'⛽' };
      return map[name] || parentIcon;
    }

    let selL1 = cats[0].name;
    let parallelEntries = [];
    let entryId = 0;

    // --- 渲染并行子条目 ---
    function renderParallels() {
      const box = document.getElementById('parallel-children');
      const count = document.getElementById('parallel-count');
      box.innerHTML = '';
      if (parallelEntries.length === 0) {
        count.classList.add('hidden');
        return;
      }
      count.classList.remove('hidden');
      count.innerText = '⏎ ' + parallelEntries.length;
      parallelEntries.forEach((p, i) => {
        const row = document.createElement('div');
        row.className = 'flex items-center gap-2 py-2 px-3 bg-white rounded-xl border border-slate-50 shadow-sm';
        row.innerHTML = `
          <div class="w-1 h-8 rounded-full shrink-0" style="background:${p.color}"></div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center text-[10px] text-slate-400 font-bold">
              <span class="font-mono shrink-0">${p.time}</span>
              <span class="flex-1 font-black text-slate-600 truncate ml-1.5">${p.icon} ${p.name}</span>
              <span class="font-black shrink-0" style="color:${p.color}">${p.dur}</span>
            </div>
            <div class="flex items-center gap-1 mt-0.5">
              <span class="text-[8px] font-black text-violet-500 bg-violet-50 rounded-full px-1.5 py-0.5 border border-violet-100">⏎ ${p.parentName}</span>
              ${p.note ? '<span class="text-[10px] text-slate-400 italic truncate">' + p.note + '</span>' : ''}
            </div>
          </div>
          <button class="text-slate-300 text-xs hover:text-red-400" onclick="removeParallel(${i})">✕</button>
        `;
        box.appendChild(row);
      });
    }

    function removeParallel(idx) {
      parallelEntries.splice(idx, 1);
      renderParallels();
    }

    // --- 选择分类 ---
    function pickCategory(l1, l2) {
      const now = new Date();
      const isBackfill = document.getElementById('time-bar').classList.contains('hidden') === false;
      let startTime, duration;
      if (isBackfill) {
        const t = document.getElementById('parallel-start').value.split(':');
        const d = new Date();
        d.setHours(+t[0], +t[1], 0, 0);
        startTime = d;
        duration = parseInt(document.getElementById('parallel-dur').value) || 30;
      } else {
        startTime = now;
        duration = 0;
      }
      const timeStr = String(startTime.getHours()).padStart(2,'0') + ':' + String(startTime.getMinutes()).padStart(2,'0');
      const cat = cats.find(c => c.name === l1);
      const durStr = isBackfill ? duration + 'min' : '⚡实时';

      parallelEntries.push({
        id: ++entryId,
        time: timeStr,
        icon: cat?.icon || '📌',
        name: l2 || l1,
        color: cat?.color || '#94a3b8',
        dur: durStr,
        parentName: parentCard.l2 || parentCard.l1,
        note: isBackfill ? '补录' : '',
      });
      renderParallels();
      closeDrawer();
    }

    // --- 打开抽屉 ---
    function openDrawer(backfill) {
      document.getElementById('drawer-overlay').classList.remove('hidden');
      document.getElementById('drawer').classList.remove('hidden');
      document.getElementById('parent-name').innerText = parentCard.icon + ' ' + parentCard.l1 + (parentCard.l2 ? ' / ' + parentCard.l2 : '');

      if (backfill) {
        document.getElementById('drawer-mode-tag').innerText = '📅 补录';
        document.getElementById('drawer-mode-tag').className = 'text-[9px] font-black text-amber-500 bg-amber-50 rounded-full px-2 py-0.5';
        document.getElementById('drawer-title').innerText = '➕ 补录并行活动';
        document.getElementById('drawer-sub').innerText = '补录于 ';
        document.getElementById('drawer-sub').innerHTML = '补录于 <b>' + (parentCard.icon + ' ' + parentCard.l1 + (parentCard.l2 ? ' / ' + parentCard.l2 : '')) + '</b>';
        document.getElementById('time-bar').classList.remove('hidden');
        const now = new Date();
        document.getElementById('parallel-start').value = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
        document.getElementById('parallel-dur').value = '30';
      } else {
        document.getElementById('drawer-mode-tag').innerText = '⚡ 实时';
        document.getElementById('drawer-mode-tag').className = 'text-[9px] font-black text-violet-500 bg-violet-50 rounded-full px-2 py-0.5';
        document.getElementById('drawer-title').innerText = '➕ 添加并行活动';
        document.getElementById('drawer-sub').innerText = '并行于 ';
        document.getElementById('drawer-sub').innerHTML = '并行于 <b>' + (parentCard.icon + ' ' + parentCard.l1 + (parentCard.l2 ? ' / ' + parentCard.l2 : '')) + '</b>';
        document.getElementById('time-bar').classList.add('hidden');
      }
      renderCats(currentView);
    }

    function closeDrawer() {
      document.getElementById('drawer-overlay').classList.add('hidden');
      document.getElementById('drawer').classList.add('hidden');
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.classList.remove('hidden');
      clearTimeout(t._timer);
      t._timer = setTimeout(() => t.classList.add('hidden'), 2000);
    }

    // --- 卡片交互：点击 + 长按 + 滑动 ---
    const card = document.getElementById('log-card');
    let startX = 0, startY = 0, swiping = false, currentTx = 0;

    card.addEventListener('touchstart', e => {
      const t = e.touches[0];
      startX = t.clientX; startY = t.clientY;
      swiping = false; currentTx = 0;
      card.classList.add('swiping');
      isLongPress = false;
      longPressTimer = setTimeout(() => {
        isLongPress = true;
        navigator.vibrate?.(20);
        openDrawer(true); // 补录模式
      }, 500);
    }, { passive: true });

    card.addEventListener('touchmove', e => {
      const t = e.touches[0];
      const dx = t.clientX - startX;
      const dy = t.clientY - startY;
      clearTimeout(longPressTimer);
      if (!swiping && Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 8) {
        swiping = true;
      }
      if (swiping) {
        e.preventDefault();
        currentTx = Math.max(-80, Math.min(80, dx));
        card.style.transform = `translateX(${currentTx}px)`;
        // 显示提示
        const bar = document.getElementById('swipe-bar');
        if (Math.abs(currentTx) > 20) {
          bar.style.opacity = '1';
          bar.querySelector('span:first-child').style.opacity = currentTx > 0 ? '1' : '0.3';
          bar.querySelector('span:last-child').style.opacity = currentTx < 0 ? '1' : '0.3';
        } else {
          bar.style.opacity = '0';
        }
      }
    }, { passive: false });

    card.addEventListener('touchend', e => {
      card.classList.remove('swiping');
      card.style.transform = '';
      clearTimeout(longPressTimer);

      const dx = e.changedTouches[0].clientX - startX;

      // 滑动
      if (swiping) {
        const bar = document.getElementById('swipe-bar');
        bar.style.opacity = '0';
        if (Math.abs(dx) > 55) {
          if (dx > 0) {
            showToast('✏️ 打开修改...');
          } else {
            showToast('🗑 已删除');
          }
        }
        swiping = false;
        return;
      }

      // 长按
      if (isLongPress) { isLongPress = false; return; }

      // 点击 → 实时并行
      openDrawer(false);
    }, { passive: true });

    // 鼠标兼容
    card.addEventListener('click', () => openDrawer(false));
    card.addEventListener('contextmenu', e => { e.preventDefault(); openDrawer(true); });
  </script>
</body>
</html>
