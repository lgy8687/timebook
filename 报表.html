<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>TimeBook · 报表沙盘 v1.5</title>
    <link rel="stylesheet" href="report.css?v=1.5">
</head>
<body>

<div class="container">

    <div class="toolbar">
        <div class="seg-row">
            <div class="seg" id="seg-period">
                <button type="button" class="seg-btn" data-period="day">日报</button>
                <button type="button" class="seg-btn" data-period="week">周报</button>
                <button type="button" class="seg-btn active" data-period="month">月报</button>
                <button type="button" class="seg-btn" data-period="year">年报</button>
            </div>
        </div>
    </div>

    <div class="header">
        <h1 id="bill-title">🧾 时间消费账单 <span class="report-version" id="report-version">v1.5</span></h1>
        <div class="period" id="bill-subtitle"></div>
    </div>

    <section class="summary-block">
        <h2 class="summary-block-title summary-block-title--main">主线摘要</h2>
        <div class="cards cards-summary" id="summary-main"></div>
    </section>

    <section class="summary-block">
        <h2 class="summary-block-title summary-block-title--parallel">并行摘要</h2>
        <div class="cards cards-summary" id="summary-parallel"></div>
    </section>

    <div class="timeline-card report-card-block" id="timeline-card">
        <div class="timeline-head">
            <div class="report-block-title" id="timeline-title">24 小时时间轴</div>
            <div class="timeline-hint" id="timeline-hint"></div>
        </div>
        <div id="timeline-body"></div>
        <div class="timeline-scale" id="timeline-scale"></div>
    </div>

    <div class="structure-card">
        <div class="structure-head">
            <div class="structure-title" id="structure-title">时间结构</div>
            <div class="chart-mode-toggle" id="chart-mode-toggle">
                <button type="button" class="chart-toggle-btn chart-main active" data-chart="main">主线</button>
                <button type="button" class="chart-toggle-btn chart-parallel" data-chart="parallel">并行</button>
            </div>
        </div>
        <div class="sunburst-layout">
            <div class="sunburst-chart-wrap">
                <svg id="sunburst-svg" class="sunburst-svg" viewBox="0 0 200 200" width="240" height="240"></svg>
            </div>
            <div class="sunburst-legend">
                <div class="legend-hint" id="chart-legend-hint"></div>
                <div class="legend-toggle">
                    <button type="button" class="active" id="btn-l1" onclick="setLegendMode('l1')">分类</button>
                    <button type="button" id="btn-l2" onclick="setLegendMode('l2')">活动明细</button>
                </div>
                <div class="legend-list" id="legend-l1"></div>
                <div class="legend-list" id="legend-l2" style="display:none"></div>
            </div>
        </div>
    </div>

    <div class="insight-placeholder" id="insight-block">
        <h3>🧬 时间洞察</h3>
        <p>行为健康分析与改善建议将在接入云端 AI 后生成。<br>当前为占位展示，月报/年报将优先开放。</p>
        <span class="tag">即将推出 · 样本沙盘</span>
    </div>

    <div class="footer" id="footer-note"></div>
</div>

<div id="tip"></div>

<script src="report-metrics.js?v=1.5"></script>
<script src="report-sample.js?v=1.5"></script>
<script src="report.js?v=1.5"></script>
</body>
</html>
