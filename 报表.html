<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TimeBook · 报表沙盘</title>
    <link rel="stylesheet" href="report.css?v=1">
</head>
<body>

<div class="container">

    <div class="toolbar">
        <div class="seg-row">
            <div class="seg" id="seg-period">
                <button type="button" class="seg-btn" data-period="day">日报</button>
                <button type="button" class="seg-btn" data-period="week">周报</button>
                <button type="button" class="seg-btn active" data-period="month">月报</button>
                <button type="button" class="seg-btn" data-period="year">年报</button>
            </div>
            <div class="seg" id="seg-view">
                <button type="button" class="seg-btn view-main active" data-view="main">主线</button>
                <button type="button" class="seg-btn view-parallel" data-view="parallel">并行</button>
            </div>
        </div>
    </div>

    <div class="header">
        <h1 id="bill-title">🧾 时间消费账单</h1>
        <div class="period" id="bill-subtitle"></div>
    </div>

    <div class="cards">
        <div class="card card-period" id="card-period">
            <div class="icon">📅</div>
            <div class="num" id="card-period-num"></div>
            <div class="lbl" id="card-period-lbl"></div>
            <div class="sub" id="card-period-sub"></div>
        </div>
        <div class="card card-hours" id="card-hours">
            <div class="icon">⏱️</div>
            <div class="num" id="card-hours-num"></div>
            <div class="lbl" id="card-hours-lbl"></div>
            <div class="sub" id="card-hours-sub"></div>
        </div>
    </div>

    <div class="structure-card">
        <div class="structure-title" id="structure-title">主线结构（内外环）</div>
        <div class="sunburst-layout">
            <div class="sunburst-chart">
                <svg id="sunburst-svg" class="sunburst-svg" viewBox="0 0 200 200" width="240" height="240"></svg>
            </div>
            <div class="sunburst-legend">
                <div class="legend-hint">内环 = 一级目录 · 外环 = 二级目录 · 悬停联动高亮</div>
                <div class="legend-toggle">
                    <button type="button" class="active" id="btn-l1" onclick="setLegendMode('l1')">一级目录</button>
                    <button type="button" id="btn-l2" onclick="setLegendMode('l2')">二级目录</button>
                </div>
                <div class="legend-list" id="legend-l1"></div>
                <div class="legend-list" id="legend-l2" style="display:none"></div>
            </div>
        </div>
    </div>

    <div class="leaderboard">
        <h3>🏆 时间排行榜</h3>
        <div id="leaderboard-rows"></div>
    </div>

    <div class="insight-placeholder" id="insight-block">
        <h3>🧬 时间洞察</h3>
        <p>行为健康分析与改善建议将在<strong>月报 / 年报</strong>提供。<br>需接入云端 AI 后生成，当前版本暂不展示模拟评分。</p>
        <span class="tag">即将推出 · 样本沙盘</span>
    </div>

    <div class="footer" id="footer-note"></div>
</div>

<div id="tip"></div>

<script src="report-sample.js?v=1"></script>
<script src="report.js?v=1"></script>
</body>
</html>
