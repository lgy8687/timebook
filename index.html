<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TimeBook Pro - 稳如老狗版</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .ring-inner { fill: none; stroke: #10b981; stroke-width: 8; stroke-linecap: round; transition: stroke-dasharray 0.3s linear; }
        .ring-outer-bg { fill: none; stroke: #fff; stroke-width: 10; }
        .segment { fill: none; stroke-width: 10; transition: all 0.5s; }
        .btn-active:active { transform: scale(0.95); filter: brightness(0.9); }
        .drawer-up { animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.15s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .flow-segment { fill: none; stroke-width: 12; stroke-linecap: butt; cursor: pointer; transition: stroke-width 0.18s ease, filter 0.18s ease; }
        .flow-segment:hover { stroke-width: 14; filter: drop-shadow(0 0 6px rgba(79,70,229,0.22)); }
        .flow-current { filter: drop-shadow(0 0 8px rgba(99,102,241,0.35)); }
        .flow-label { font-size: 4px; font-weight: 900; fill: #334155; paint-order: stroke; stroke: white; stroke-width: 0.8px; stroke-linejoin: round; }
        .hour-segment { fill: none; stroke-width: 10; stroke-linecap: butt; transition: stroke-dasharray 0.3s linear, stroke-dashoffset 0.3s linear; }
        .time-hand { stroke: #0f172a; stroke-width: 1.25; stroke-linecap: round; opacity: 0.9; filter: drop-shadow(0 0 3px rgba(15,23,42,0.3)); }
        .hour-hand { stroke: #4f46e5; stroke-width: 1.15; stroke-linecap: round; opacity: 0.95; filter: drop-shadow(0 0 4px rgba(79,70,229,0.35)); }
        .time-dot { fill: #0f172a; stroke: white; stroke-width: 1.2; }
        .hour-dot { fill: #4f46e5; stroke: white; stroke-width: 1.1; }
        .report-card { background: white; border: 1px solid #eef2f7; border-radius: 24px; box-shadow: 0 1px 8px rgba(15, 23, 42, 0.04); }
        .report-title { font-size: 13px; font-weight: 900; color: #64748b; letter-spacing: .08em; text-transform: uppercase; }
        .timeline-track { position: relative; height: 52px; border-radius: 18px; background: #f1f5f9; overflow: hidden; }
        .timeline-block { position: absolute; top: 0; bottom: 0; min-width: 2px; display: flex; align-items: center; justify-content: center; color: white; font-size: 12px; font-weight: 900; white-space: nowrap; overflow: hidden; text-shadow: 0 1px 2px rgba(0,0,0,.22); }
        .timeline-now { position: absolute; top: -8px; bottom: -8px; width: 2px; background: #0f172a; box-shadow: 0 0 0 3px rgba(15,23,42,.08); }
        .dist-row { display: grid; grid-template-columns: 80px 1fr 52px; gap: 10px; align-items: center; }
        .dist-bar { height: 12px; border-radius: 999px; background: #e2e8f0; overflow: hidden; }
        .dist-fill { height: 100%; border-radius: 999px; }
        .flow-dashboard { display: grid; grid-template-columns: minmax(280px, 360px) minmax(260px, 1fr); gap: 20px; align-items: center; max-width: 900px; margin: 0 auto; }
        .flow-panel { background: #f8fafc; border: 1px solid #eef2f7; border-radius: 24px; padding: 16px; }
        .flow-panel-label { font-size: 11px; font-weight: 900; color: #94a3b8; letter-spacing: .08em; text-transform: uppercase; }
        .flow-panel-value { font-size: 24px; line-height: 1.15; font-weight: 900; color: #0f172a; margin-top: 6px; }
        .clock-stage { display: grid; grid-template-columns: repeat(2, minmax(260px, 360px)); gap: 160px; justify-content: center; align-items: start; padding: 10px 0 6px; }
        .clock-face { 
            position: relative; background: #ffffff; border-radius: 50%; 
            box-shadow: 0 4px 24px rgba(0,0,0,0.06); 
            border: 1px solid #e2e8f0; 
        }
        .clock-face svg { overflow: visible; }
        .clock-needle-minute { display: none; } /* 隐藏旧指针，只留秒针 */
        .clock-needle-second { position: absolute; bottom: 50%; left: calc(50% - 0.75px); width: 1.5px; height: 48%; background: #ef4444 !important; transform-origin: bottom; border-radius: 1px; z-index: 11; transition: none !important; }
        .clock-segment { fill: none; stroke-width: 14; stroke-linecap: butt; transition: stroke-dasharray .3s linear, stroke-dashoffset .3s linear; cursor: pointer; }
        .donut-segment { fill: none; stroke-width: 15; stroke-linecap: butt; cursor: pointer; transition: stroke-width .18s ease, opacity .18s ease; }
        .donut-segment:hover { stroke-width: 17; opacity: .9; }
        .day-remain-track { height: 26px; border-radius: 999px; background: #e5e7eb; overflow: hidden; position: relative; }
        .day-remain-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, #3b82f6 0%, #22d3ee 100%); transition: width .35s linear; position: absolute; left: 0; top: 0; }
        .day-remain-label { position: absolute; inset: 0; display: flex; align-items: center; padding: 0 14px; font-size: 13px; font-weight: 900; color: white; text-shadow: 0 1px 2px rgba(15, 23, 42, .22); }
        @media (max-width: 720px) {
            .flow-dashboard { grid-template-columns: 1fr; max-width: 420px; }
            .clock-stage { grid-template-columns: 1fr; max-width: 300px; margin: 0 auto; gap: 12px; }
            .clock-stage .clock-face { width: 210px !important; height: 210px !important; }
            .clock-stage .clock-face .text-4xl { font-size: 1.75rem !important; }
            .clock-stage .clock-face .text-2xl { font-size: 1.25rem !important; }
            #home-shortcuts button { padding: 10px !important; min-height: 72px !important; }
            #home-shortcuts button .text-3xl { font-size: 1.5rem !important; }
            #home-shortcuts button .text-base { font-size: 0.75rem !important; }
            .day-remain-track { height: 22px; }
            .day-remain-label { font-size: 11px; padding: 0 10px; }
            #free-input { font-size: 14px; padding: 12px 16px !important; }
            #header-timer { font-size: 1.25rem !important; }
            .report-card { padding: 14px !important; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 h-screen flex flex-col overflow-hidden select-none font-sans text-base">

    <header class="bg-white p-4 border-b border-slate-100 shrink-0 z-10 flex justify-between items-center shadow-sm">
        <div class="flex items-center space-x-3">
            <div id="status-light" class="w-2.5 h-2.5 rounded-full bg-slate-300"></div>
            <div>
                <div class="flex items-center space-x-1"><span class="text-[9px] text-indigo-500 font-black uppercase tracking-widest">Active</span></div>
                <div class="flex items-center space-x-2 text-sm font-black text-slate-700">
                    <span id="header-l2">等待开启...</span>
                    <span id="header-memo" class="text-[10px] text-slate-300 font-normal italic truncate max-w-[100px]"></span>
                </div>
            </div>
        </div>
        <div id="header-timer" class="text-2xl font-mono font-black text-indigo-600">00:00:00</div>
    </header>

    <main class="flex-1 overflow-y-auto p-4 pb-32">
        <section id="page-record" class="tab-content active space-y-5">
            <div class="day-remain-track">
                <div id="day-remain-fill" class="day-remain-fill" style="width: 100%;"></div>
                <div id="day-remain-label" class="day-remain-label">今天剩余 --%</div>
            </div>
            <div class="space-y-3">
                <div class="flex justify-between items-end px-1">
                    <h3 class="text-xs font-black text-slate-300 uppercase tracking-widest">快捷入口</h3>
                    <span onclick="switchTab('config')" class="text-xs text-indigo-400 font-bold">去设置</span>
                </div>
                <div id="home-shortcuts" class="grid grid-cols-3 gap-3"></div>
            </div>
            <div class="flex space-x-2">
                <input type="text" id="free-input" placeholder="输入：#标签 内容" class="flex-1 bg-white border-none rounded-2xl px-4 py-4 shadow-sm text-base focus:ring-2 focus:ring-indigo-100">
                <button onclick="handleFreeInput()" class="bg-slate-800 text-white px-6 rounded-2xl font-bold btn-active text-lg">记</button>
            </div>
            <div class="bg-white rounded-[32px] p-5 shadow-sm border border-slate-100">
                <div class="clock-stage">
                    <div class="flex flex-col items-center gap-4">
                        <div class="clock-face w-64 h-64 md:w-80 md:h-80">
                            <svg viewBox="0 0 120 120" class="absolute inset-0 w-full h-full -rotate-90">
                                <circle cx="60" cy="60" r="50" fill="none" stroke="#e2e8f0" stroke-width="14" />
                                <g id="svg-60m"></g>
                            </svg>
                            <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
                                <span class="text-[9px] text-slate-400 font-black tracking-widest uppercase">Remaining</span>
                                <span id="label-60m-remain" class="text-4xl font-mono font-black text-emerald-500">60</span>
                            </div>
                            <div id="hand-60m" class="clock-needle-minute" style="background:#10b981;"></div>
                            <div id="second-60m" class="clock-needle-second"></div>
                        </div>
                        <div class="text-[10px] font-black text-slate-400 tracking-widest uppercase">60M</div>
                    </div>
                    <div class="flex flex-col items-center gap-4">
                        <div class="clock-face w-64 h-64 md:w-80 md:h-80">
                            <svg viewBox="0 0 120 120" class="absolute inset-0 w-full h-full -rotate-90">
                                <circle cx="60" cy="60" r="50" fill="none" stroke="#e2e8f0" stroke-width="14" />
                                <g id="svg-24h-marks"></g>
                                <g id="svg-24h"></g>
                            </svg>
                            <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
                                <span class="text-[9px] text-slate-400 font-black tracking-widest uppercase">Daily Remaining</span>
                                <span id="label-24h-remain" class="text-2xl font-mono font-black text-indigo-500 leading-tight">00:00</span>
                            </div>
                            <div id="hand-24h" class="clock-needle-minute" style="background:#6366f1;"></div>
                            <div id="second-24h" class="clock-needle-second"></div>
                        </div>
                        <div class="text-[10px] font-black text-slate-400 tracking-widest uppercase">24H</div>
                    </div>
                </div>
                <div id="flow-detail" class="mt-5 bg-slate-50 border border-slate-100 rounded-3xl px-4 py-3 text-sm text-slate-500 font-bold">
                    点击圆盘上的时间段查看备注和耗时
                </div>
            </div>
            <div class="flex items-center justify-between px-1">
                <h3 class="text-xs font-black text-slate-300 uppercase tracking-widest">最近细节</h3>
                <span class="text-xs text-slate-300 font-bold">圆盘是主视图</span>
            </div>
            <div id="log-list" class="space-y-3"></div>
            <div id="load-more-wrap" class="text-center"></div>
        </section>

        <section id="page-report" class="tab-content space-y-5">
            <div class="flex items-end justify-between px-1">
                <div>
                    <h2 class="text-2xl font-black text-slate-800">日报表</h2>
                    <div id="report-date" class="text-sm font-bold text-slate-400">北京时间</div>
                </div>
                <div class="text-right">
                    <div id="report-cur-l2" class="text-base font-black text-indigo-600">空闲</div>
                    <div id="report-cur-timer" class="text-sm font-mono font-black text-slate-400">00:00:00</div>
                </div>
            </div>

            <div id="report-stats" class="grid grid-cols-3 gap-3"></div>

            <div class="report-card p-5 space-y-4">
                <div class="flex items-center justify-between">
                    <div class="report-title">时间占比</div>
                    <div class="flex border border-emerald-600 rounded-2xl overflow-hidden text-sm font-black">
                        <button id="report-mode-l1" onclick="setReportMode('l1')" class="px-4 py-2 bg-emerald-600 text-white">一级分类</button>
                        <button id="report-mode-l2" onclick="setReportMode('l2')" class="px-4 py-2 text-emerald-700">全部</button>
                    </div>
                </div>
                <div class="relative mx-auto w-full max-w-[420px] aspect-square">
                    <svg viewBox="-30 -25 180 170" class="w-full h-full -rotate-90">
                        <circle cx="60" cy="60" r="42" fill="none" stroke="#f1f5f9" stroke-width="18" />
                        <g id="report-donut-segments"></g>
                        <g id="report-donut-labels"></g>
                    </svg>
                    <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none text-center">
                        <div class="text-3xl font-black text-slate-800">⇄</div>
                        <div id="report-donut-center" class="text-base font-black text-slate-700 mt-1">切换到活动</div>
                    </div>
                </div>
            </div>

            <div class="report-card p-5 space-y-4">
                <div class="flex justify-between items-center">
                    <div class="report-title">24 小时时间轴</div>
                    <div class="text-xs font-black text-slate-300">00:00 → 24:00</div>
                </div>
                <div id="report-timeline" class="timeline-track"></div>
                <div class="flex justify-between text-[11px] font-bold text-slate-300">
                    <span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>24:00</span>
                </div>
            </div>

            <div class="report-card p-5 space-y-4">
                <div class="report-title">一级目录分布</div>
                <div id="report-l1-dist" class="space-y-3"></div>
            </div>

            <div class="report-card p-5 space-y-4">
                <div class="report-title">活动明细</div>
                <div id="report-l2-dist" class="space-y-3"></div>
            </div>

            <div class="report-card p-5 space-y-4">
                <div class="report-title">详细记录</div>
                <div id="report-detail-list" class="space-y-3"></div>
            </div>
        </section>

        <section id="page-config" class="tab-content space-y-6">
            <div class="flex items-center space-x-3">
                <button onclick="switchTab('record')" class="bg-white w-10 h-10 rounded-xl shadow-sm flex items-center justify-center text-lg">⬅️</button>
                <h2 class="text-lg font-black text-slate-800">设置中心</h2>
            </div>
            <div class="bg-white rounded-3xl p-5 shadow-sm border border-slate-50 space-y-4">
                <div class="flex justify-between items-center">
                    <h3 class="text-[11px] font-black text-indigo-500 uppercase">标签字体大小</h3>
                    <span id="fontsize-value" class="text-[10px] text-indigo-500 font-black">13px</span>
                </div>
                <input type="range" min="8" max="22" value="13" id="fontsize-slider" class="w-full accent-indigo-500">
            </div>
            <div class="bg-white rounded-3xl p-5 shadow-sm border border-slate-50 space-y-4">
                <div class="flex justify-between items-center">
                    <h3 class="text-[11px] font-black text-indigo-500 uppercase">首页大图标设置</h3>
                    <button onclick="openShortcutPicker()" class="text-[10px] bg-indigo-50 text-indigo-600 px-3 py-1 rounded-full font-black">+ 选取分类</button>
                </div>
                <div id="shortcut-list" class="space-y-2"></div>
            </div>
            <div class="bg-white rounded-3xl p-5 shadow-sm border border-slate-50 space-y-4">
                <div class="flex justify-between items-center">
                    <h3 class="text-[11px] font-black text-slate-400 uppercase">全量目录管理</h3>
                    <button onclick="addL1()" class="text-[9px] bg-slate-50 text-slate-400 px-3 py-1 rounded-full font-black">+ 一级类</button>
                </div>
                <div id="full-cat-list" class="space-y-4"></div>
            </div>
            <button onclick="if(confirm('清空？')){localStorage.clear();location.reload();}" class="w-full py-4 text-[10px] text-slate-300 font-bold uppercase tracking-widest">Factory Reset</button>
        </section>
    </main>

    <nav class="bg-white border-t border-slate-100 fixed bottom-0 w-full h-24 grid grid-cols-3 items-center px-8 pb-6 z-40">
        <button onclick="switchTab('record')" class="flex flex-col items-center text-indigo-600" id="nav-record">
            <span class="text-xl">📋</span><span class="text-[10px] mt-1 font-bold">流水</span>
        </button>
        <div class="relative -top-6 flex justify-center">
            <button onclick="openDrawer()" class="w-16 h-16 bg-indigo-600 rounded-full shadow-xl flex items-center justify-center text-2xl text-white border-4 border-white btn-active">＋</button>
        </div>
        <button onclick="switchTab('report')" class="flex flex-col items-center text-slate-400" id="nav-report">
            <span class="text-xl">📊</span><span class="text-[10px] mt-1 font-bold">报表</span>
        </button>
    </nav>

    <div id="drawer" class="hidden fixed inset-0 bg-slate-900/40 z-50 flex flex-col justify-end backdrop-blur-sm">
        <div class="bg-white w-full rounded-t-[40px] h-3/4 drawer-up flex flex-col">
            <div class="p-6 flex justify-between items-center shrink-0 border-b border-slate-50">
                <h2 id="drawer-title" class="text-lg font-black">选择分类</h2>
                <button onclick="closeDrawer()" class="text-slate-300 text-2xl">✕</button>
            </div>
            <div class="flex-1 overflow-hidden flex">
                <div class="w-1/4 bg-slate-50 overflow-y-auto" id="drawer-l1"></div>
                <div class="w-3/4 p-4 overflow-y-auto grid grid-cols-2 gap-3 h-fit" id="drawer-l2"></div>
            </div>
            <div id="drawer-footer" class="p-6 bg-white shrink-0 border-t border-slate-50">
                <input type="text" id="drawer-note" placeholder="选填备注..." class="w-full bg-slate-50 border-none rounded-2xl px-4 py-3 text-sm focus:ring-2 focus:ring-indigo-500">
            </div>
        </div>
    </div>

    <!-- 自定义输入弹窗 (替代 prompt, 移动端友好) -->
    <div id="prompt-modal" class="hidden fixed inset-0 bg-slate-900/40 z-50 flex items-center justify-center backdrop-blur-sm fade-in">
        <div class="bg-white rounded-3xl p-6 w-4/5 max-w-sm shadow-xl">
            <h3 id="prompt-title" class="text-sm font-black mb-4">输入</h3>
            <input type="text" id="prompt-input" class="w-full bg-slate-50 border-none rounded-2xl px-4 py-3 text-sm focus:ring-2 focus:ring-indigo-500 mb-4" autocomplete="off">
            <div class="flex space-x-3">
                <button onclick="closePrompt(null)" class="flex-1 py-3 text-sm font-bold text-slate-400 bg-slate-50 rounded-2xl">取消</button>
                <button onclick="confirmPrompt()" class="flex-1 py-3 text-sm font-bold text-white bg-indigo-600 rounded-2xl">确定</button>
            </div>
        </div>
    </div>

    <!-- 编辑备注弹窗 -->
    <div id="edit-modal" class="hidden fixed inset-0 bg-slate-900/40 z-50 flex items-center justify-center backdrop-blur-sm fade-in">
        <div class="bg-white rounded-3xl p-6 w-4/5 max-w-sm shadow-xl">
            <h3 class="text-sm font-black mb-1">编辑备注</h3>
            <div id="edit-log-preview" class="text-[10px] text-slate-400 mb-3"></div>
            <input type="text" id="edit-input" class="w-full bg-slate-50 border-none rounded-2xl px-4 py-3 text-sm focus:ring-2 focus:ring-indigo-500 mb-4" autocomplete="off">
            <div class="flex space-x-3">
                <button onclick="closeEdit()" class="flex-1 py-3 text-sm font-bold text-slate-400 bg-slate-50 rounded-2xl">取消</button>
                <button onclick="confirmEdit()" class="flex-1 py-3 text-sm font-bold text-white bg-indigo-600 rounded-2xl">确定</button>
            </div>
        </div>
    </div>

    <script>
        // --- 数据模型 ---
        let cats = JSON.parse(localStorage.getItem('v9_cats')) || [
            { id: 1, name: "上班", icon: "💼", color: "#6366f1", subs: ["开网约车", "开会", "写代码", "办公"] },
            { id: 2, name: "生活", icon: "🏠", color: "#f59e0b", subs: ["睡觉", "起床", "休息", "洗漱"] },
            { id: 3, name: "交通", icon: "🚗", color: "#ef4444", subs: ["开车", "加油"] },
            { id: 4, name: "餐饮", icon: "🍱", color: "#10b981", subs: ["早午晚餐", "午休"] }
        ];
        let shortcuts = JSON.parse(localStorage.getItem('v9_shorts')) || [
            { l1: "上班", l2: "开网约车", icon: "🚕" },
            { l1: "生活", l2: "睡觉", icon: "🛌" },
            { l1: "交通", l2: "开车", icon: "🚗" }
        ];
        let logs = JSON.parse(localStorage.getItem('v9_logs')) || [];
        let current = JSON.parse(localStorage.getItem('v9_current')) || null;
        let labelFontSize = parseInt(localStorage.getItem('v9_labelFontSize')) || 13;
        
        let selL1 = cats[0]?.name || "";
        let pickerMode = 'record';
        let logLimit = 10;
        let editTarget = null; // 编辑目标索引
        let selectedFlowId = null;
        let editingShortcutIndex = null;
        let reportMode = 'l1';
        const BJ_OFFSET = 8 * 60 * 60 * 1000;
        const HOUR_MS = 60 * 60 * 1000;
        const DAY_MS = 24 * HOUR_MS;

        window.onload = () => { renderAll(); tickLoop(); };

        let tickRAF = null;
        function tickLoop() {
            tick();
            tickRAF = requestAnimationFrame(tickLoop);
        }

        function renderAll() {
            renderShortcuts();
            renderLogs();
            renderConfig();
            renderReport();
            updateUI();
        }

        function formatDuration(ms) {
            const total = Math.max(0, Math.floor(ms / 1000));
            const h = String(Math.floor(total / 3600)).padStart(2, '0');
            const m = String(Math.floor((total % 3600) / 60)).padStart(2, '0');
            const s = String(total % 60).padStart(2, '0');
            return `${h}:${m}:${s}`;
        }

        function setText(id, value) {
            const el = document.getElementById(id);
            if (el) el.innerText = value;
        }

        function beijingPeriodStart(ms, periodMs) {
            return Math.floor((ms + BJ_OFFSET) / periodMs) * periodMs - BJ_OFFSET;
        }

        function pad2(n) {
            return String(n).padStart(2, '0');
        }

        function formatBeijingClock(ms) {
            const d = new Date(ms + BJ_OFFSET);
            return `${pad2(d.getUTCHours())}:${pad2(d.getUTCMinutes())}`;
        }

        function formatBeijingDate(ms) {
            const d = new Date(ms + BJ_OFFSET);
            return `${d.getUTCFullYear()}-${pad2(d.getUTCMonth() + 1)}-${pad2(d.getUTCDate())}`;
        }

        function getCat(name) {
            return cats.find(c => c.name === name);
        }

        function displayName(log) {
            return log?.l2 || log?.l1 || "未分类";
        }

        function formatMinutes(ms) {
            return `${Math.max(1, Math.round(ms / 60000))} 分钟`;
        }

        function formatHours(ms) {
            return `${(ms / HOUR_MS).toFixed(1)}h`;
        }

        function formatShortDuration(ms) {
            const totalMinutes = Math.max(0, Math.floor(ms / 60000));
            const h = Math.floor(totalMinutes / 60);
            const m = totalMinutes % 60;
            return `${h}h ${pad2(m)}m`;
        }

        function formatClock(ms) {
            return formatBeijingClock(ms);
        }

        function circleSegment(parent, r, startMs, endMs, rangeStart, rangeEnd, color, cls, data) {
            const total = rangeEnd - rangeStart;
            const start = Math.max(startMs, rangeStart);
            const end = Math.min(endMs, rangeEnd);
            if (end <= start) return null;
            const c = Math.PI * 2 * r;
            const offset = ((start - rangeStart) / total) * c;
            const len = ((end - start) / total) * c;
            const seg = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            seg.setAttribute("cx", "60");
            seg.setAttribute("cy", "60");
            seg.setAttribute("r", r);
            seg.setAttribute("stroke", color);
            seg.setAttribute("class", cls);
            seg.setAttribute("stroke-dasharray", `${len} ${c - len}`);
            seg.setAttribute("stroke-dashoffset", -offset);
            if (data) {
                seg.addEventListener('click', () => {
                    selectedFlowId = data.id;
                    showFlowDetail(data);
                    renderFlow();
                });
            }
            parent.appendChild(seg);
            return seg;
        }

        function drawClockSegment(parent, r, startMs, endMs, rangeStart, rangeEnd, color, data) {
            const total = rangeEnd - rangeStart;
            const start = Math.max(startMs, rangeStart);
            const end = Math.min(endMs, rangeEnd);
            if (end <= start) return;
            const circ = Math.PI * 2 * r;
            const dash = ((end - start) / total) * circ;
            const offset = -((start - rangeStart) / total) * circ;
            const arc = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            arc.setAttribute("cx", "60");
            arc.setAttribute("cy", "60");
            arc.setAttribute("r", r);
            arc.setAttribute("class", "clock-segment");
            arc.setAttribute("stroke", color);
            arc.setAttribute("stroke-dasharray", `${Math.max(0.5, dash - 0.5)} ${circ}`);
            arc.setAttribute("stroke-dashoffset", offset);
            if (data) {
                arc.addEventListener('click', () => {
                    selectedFlowId = data.id;
                    showFlowDetail(data);
                    renderFlow();
                });
            }
            parent.appendChild(arc);
        }

        function render24hMarks() {
            const marks = document.getElementById('svg-24h-marks');
            if (!marks || marks.dataset.ready) return;
            marks.dataset.ready = "1";
            marks.innerHTML = "";
            for (let i = 0; i < 24; i++) {
                const angle = ((i * 15) * Math.PI) / 180;
                const isMajor = i % 3 === 0;
                const r1 = 44, r2 = isMajor ? 48 : 46;
                const x1 = 60 + Math.cos(angle) * r1;
                const y1 = 60 + Math.sin(angle) * r1;
                const x2 = 60 + Math.cos(angle) * r2;
                const y2 = 60 + Math.sin(angle) * r2;
                const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                line.setAttribute("x1", x1); line.setAttribute("y1", y1);
                line.setAttribute("x2", x2); line.setAttribute("y2", y2);
                line.setAttribute("stroke", isMajor ? "#94a3b8" : "#cbd5e1");
                line.setAttribute("stroke-width", isMajor ? "0.8" : "0.5");
                marks.appendChild(line);
                if (isMajor) {
                    const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
                    text.setAttribute("x", 60 + Math.cos(angle) * 40);
                    text.setAttribute("y", 60 + Math.sin(angle) * 40);
                    text.setAttribute("text-anchor", "middle");
                    text.setAttribute("dominant-baseline", "middle");
                    text.setAttribute("style", "font-size:3.5px; font-weight:900; fill:#94a3b8; paint-order:stroke; stroke:#f8fafc; stroke-width:0.5px;");
                    text.textContent = i;
                    marks.appendChild(text);
                }
            }
        }

        // --- 核心记账逻辑 (彻底分离) ---
        function executeRecord(l1, l2, tag, note) {
            const now = Date.now();
            const cat = getCat(l1);
            const color = cat ? cat.color : "#cbd5e1";
            if (current) {
                const dur = Math.max(1, Math.round((now - current.startTime) / 60000));
                logs.unshift({ ...current, endTime: now, duration: dur, color: current.color || color, status: current.l1 ? 'ok' : 'pending' });
                localStorage.setItem('v9_logs', JSON.stringify(logs));
            }
            current = { id: now, startTime: now, l1, l2, tag, note, color };
            localStorage.setItem('v9_current', JSON.stringify(current));
            closeDrawer(); renderAll();
        }

                const startDay = formatBeijingDate(log.startTime);
                const endMs = log.endTime || log.startTime;
                const endDay = formatBeijingDate(endMs);
                // 不跨天：只归入开始那天
                if (startDay === endDay) {
                    if (!dayMap.has(startDay)) dayMap.set(startDay, []);
                    dayMap.get(startDay).push(log);
                } else {
                    // 跨天：在开始那天和结束那天都保留
                    if (!dayMap.has(startDay)) dayMap.set(startDay, []);
                    dayMap.get(startDay).push(log);
                    if (!dayMap.has(endDay)) dayMap.set(endDay, []);
                    // 跨天条目在结束那天标一个"跨天"标记
                    dayMap.get(endDay).push({ ...log, _crossDay: true });

            const days = [...dayMap.keys()].sort((a,b) => b.localeCompare(a));

        function getTodaySegments() {
            const now = Date.now();
            const dayStart = beijingPeriodStart(now, DAY_MS);
            const dayEnd = dayStart + DAY_MS;
            const currentLog = current ? { ...current, endTime: now, live: true } : null;
            return logs
                .map(l => ({ ...l, endTime: l.endTime || l.startTime }))
                .concat(currentLog ? [currentLog] : [])
                .filter(Boolean)
                .filter(l => l.endTime > dayStart && l.startTime < dayEnd)
                .map(l => ({
                    ...l,
                    clippedStart: Math.max(l.startTime, dayStart),
                    clippedEnd: Math.min(l.endTime, dayEnd)
                }))
                .filter(l => l.clippedEnd > l.clippedStart)
                .sort((a, b) => a.clippedStart - b.clippedStart);
        }

        function renderReport() {
            const dateEl = document.getElementById('report-date');
            if (!dateEl) return;
            const now = Date.now();
            const dayStart = beijingPeriodStart(now, DAY_MS);
            const segments = getTodaySegments();
            const totalMs = segments.reduce((sum, l) => sum + (l.clippedEnd - l.clippedStart), 0);
            const activities = new Set(segments.map(displayName));
            dateEl.innerText = `北京时间 ${formatBeijingDate(now)}`;

            const stats = [
                { label: "已记录", value: formatHours(totalMs) },
                { label: "活动数", value: activities.size },
                { label: "记录条数", value: segments.length }
            ];
            const statsBox = document.getElementById('report-stats');
            statsBox.innerHTML = "";
            stats.forEach(s => {
                const card = document.createElement('div');
                card.className = "rounded-3xl p-4 bg-indigo-600 text-white shadow-sm";
                const value = document.createElement('div');
                value.className = "text-2xl font-black";
                value.innerText = s.value;
                const label = document.createElement('div');
                label.className = "text-xs font-bold opacity-80 mt-1";
                label.innerText = s.label;
                card.append(value, label);
                statsBox.appendChild(card);
            });

            renderReportTimeline(segments, dayStart);
            const l1Rows = aggregateBy(segments, l => l.l1 || "未分类");
            const l2Rows = aggregateBy(segments, displayName);
            renderDonut(reportMode === 'l1' ? l1Rows : l2Rows, totalMs);
            renderDistribution('report-l1-dist', l1Rows, totalMs);
            renderDistribution('report-l2-dist', l2Rows, totalMs);
            renderReportDetails(segments);
        }

        function setReportMode(mode) {
            reportMode = mode;
            renderReport();
        }

        function aggregateBy(segments, keyFn) {
            const map = new Map();
            segments.forEach(l => {
                const key = keyFn(l);
                const old = map.get(key) || { name: key, ms: 0, color: getCat(l.l1)?.color || "#94a3b8" };
                old.ms += l.clippedEnd - l.clippedStart;
                map.set(key, old);
            });
            return [...map.values()].sort((a, b) => b.ms - a.ms);
        }

        function renderReportTimeline(segments, dayStart) {
            const track = document.getElementById('report-timeline');
            track.innerHTML = "";
            segments.forEach(l => {
                const left = ((l.clippedStart - dayStart) / DAY_MS) * 100;
                const width = ((l.clippedEnd - l.clippedStart) / DAY_MS) * 100;
                const block = document.createElement('button');
                block.type = 'button';
                block.className = "timeline-block";
                block.style.left = `${left}%`;
                block.style.width = `${Math.max(width, 0.25)}%`;
                block.style.background = getCat(l.l1)?.color || "#94a3b8";
                block.innerText = width > 7 ? displayName(l) : "";
                block.title = `${displayName(l)} ${formatBeijingClock(l.clippedStart)}-${formatBeijingClock(l.clippedEnd)}`;
                block.addEventListener('click', () => showFlowDetail(l));
                track.appendChild(block);
            });
            const nowLeft = ((Date.now() - dayStart) / DAY_MS) * 100;
            const nowLine = document.createElement('div');
            nowLine.className = "timeline-now";
            nowLine.style.left = `${Math.min(100, Math.max(0, nowLeft))}%`;
            track.appendChild(nowLine);
        }

        function renderDonut(rows, totalMs) {
            const segBox = document.getElementById('report-donut-segments');
            const labelBox = document.getElementById('report-donut-labels');
            const center = document.getElementById('report-donut-center');
            const l1Btn = document.getElementById('report-mode-l1');
            const l2Btn = document.getElementById('report-mode-l2');
            if (!segBox || !labelBox) return;
            segBox.innerHTML = "";
            labelBox.innerHTML = "";
            center.innerText = reportMode === 'l1' ? '切换到活动' : '切换到分类';
            l1Btn.className = `px-4 py-2 ${reportMode === 'l1' ? 'bg-emerald-600 text-white' : 'text-emerald-700'}`;
            l2Btn.className = `px-4 py-2 ${reportMode === 'l2' ? 'bg-emerald-600 text-white' : 'text-emerald-700'}`;
            if (!rows.length || !totalMs) return;
            const circ = Math.PI * 2 * 42;
            let offsetMs = 0;
            rows.forEach(row => {
                const dash = (row.ms / totalMs) * circ;
                const offset = -(offsetMs / totalMs) * circ;
                const arc = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                arc.setAttribute("cx", "60");
                arc.setAttribute("cy", "60");
                arc.setAttribute("r", "42");
                arc.setAttribute("class", "donut-segment");
                arc.setAttribute("stroke", row.color);
                arc.setAttribute("stroke-dasharray", `${Math.max(1, dash - 1)} ${circ}`);
                arc.setAttribute("stroke-dashoffset", offset);
                segBox.appendChild(arc);

                const mid = (offsetMs + row.ms / 2) / totalMs;
                const pct = Math.round((row.ms / totalMs) * 100);
                drawDonutLabel(labelBox, mid * 360, row.color, `${row.name} ${pct}%`);
                offsetMs += row.ms;
            });
        }

        function drawDonutLabel(parent, deg, color, label) {
            const angle = (deg * Math.PI) / 180;
            const r1 = 53, r2 = 62, rt = 72;
            const x1 = 60 + Math.cos(angle) * r1;
            const y1 = 60 + Math.sin(angle) * r1;
            const x2 = 60 + Math.cos(angle) * r2;
            const y2 = 60 + Math.sin(angle) * r2;
            const tx = 60 + Math.cos(angle) * rt;
            const ty = 60 + Math.sin(angle) * rt;
            const line = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
            const side = Math.cos(angle) >= 0 ? 1 : -1;
            line.setAttribute("points", `${x1},${y1} ${x2},${y2} ${tx + side * 10},${ty}`);
            line.setAttribute("fill", "none");
            line.setAttribute("stroke", "#b8b8b8");
            line.setAttribute("stroke-width", "0.7");
            parent.appendChild(line);
            const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
            text.setAttribute("x", tx + side * 12);
            text.setAttribute("y", ty);
            text.setAttribute("text-anchor", side > 0 ? "start" : "end");
            text.setAttribute("dominant-baseline", "middle");
            text.setAttribute("class", "radial-label");
            text.setAttribute("transform", `rotate(90 ${tx + side * 12} ${ty})`);
            text.textContent = label.slice(0, 12);
            parent.appendChild(text);
        }

        function renderReportDetails(segments) {
            const box = document.getElementById('report-detail-list');
            box.innerHTML = "";
            if (!segments.length) {
                const empty = document.createElement('div');
                empty.className = "text-sm font-bold text-slate-300";
                empty.innerText = "暂无记录";
                box.appendChild(empty);
                return;
            }
            segments.forEach(l => {
                const row = document.createElement('div');
                row.className = "grid grid-cols-[86px_1fr_56px] gap-3 items-center text-sm";
                const time = document.createElement('div');
                time.className = "font-mono font-black text-slate-400";
                time.innerText = `${formatBeijingClock(l.clippedStart)}-${formatBeijingClock(l.clippedEnd)}`;
                const main = document.createElement('div');
                main.className = "min-w-0";
                const title = document.createElement('div');
                title.className = "font-black text-slate-700 truncate";
                title.innerText = displayName(l);
                const note = document.createElement('div');
                note.className = "text-xs font-bold text-slate-300 truncate";
                note.innerText = l.note || l.l1 || "";
                main.append(title, note);
                const dur = document.createElement('div');
                dur.className = "font-mono font-black text-indigo-500 text-right";
                dur.innerText = formatHours(l.clippedEnd - l.clippedStart);
                row.append(time, main, dur);
                box.appendChild(row);
            });
        }

        // --- 抽屉分发 ---
        function openDrawer() { 
            pickerMode = 'record'; 
            document.getElementById('drawer-title').innerText = "记一笔活动";
            document.getElementById('drawer-footer').classList.remove('hidden');
            document.getElementById('drawer-note').value = "";
            document.getElementById('drawer').classList.remove('hidden'); 
            renderPicker(); 
        }
        function openShortcutPicker() { 
            pickerMode = 'shortcut'; 
            document.getElementById('drawer-title').innerText = "设为首页大图标";
            document.getElementById('drawer-footer').classList.add('hidden');
            document.getElementById('drawer').classList.remove('hidden'); 
            renderPicker(); 
        }
        function renderPicker() {
            const l1Box = document.getElementById('drawer-l1');
            const l2Box = document.getElementById('drawer-l2');
            l1Box.innerHTML = "";
            l2Box.innerHTML = "";
            if (!cats.length) {
                const empty = document.createElement('div');
                empty.className = "p-4 text-sm text-slate-400 font-bold";
                empty.innerText = "暂无分类";
                l2Box.appendChild(empty);
                return;
            }
            if (!cats.some(c => c.name === selL1)) selL1 = cats[0].name;

            cats.forEach(c => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = `w-full py-5 text-sm font-black ${selL1 === c.name ? 'bg-white text-indigo-600 border-l-4 border-indigo-600' : 'text-slate-400'}`;
                btn.innerText = c.name;
                btn.addEventListener('click', () => {
                    selL1 = c.name;
                    renderPicker();
                });
                l1Box.appendChild(btn);
            });

            const selected = cats.find(c => c.name === selL1);
            if (!selected) return;
            const direct = document.createElement('button');
            direct.type = 'button';
            direct.className = "bg-indigo-600 text-white border border-indigo-600 p-4 rounded-2xl text-sm font-black shadow-sm active:bg-indigo-700";
            direct.innerText = `直接记录：${selected.name}`;
            direct.addEventListener('click', () => drawerPick(selected.name, ""));
            l2Box.appendChild(direct);

            selected.subs.forEach(s => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = "bg-white border border-slate-100 p-4 rounded-2xl text-sm font-black text-slate-600 shadow-sm active:bg-indigo-50";
                btn.innerText = s;
                btn.addEventListener('click', () => drawerPick(selL1, s));
                l2Box.appendChild(btn);
            });
            if (!selected.subs.length) {
                const hint = document.createElement('div');
                hint.className = "col-span-2 text-sm text-slate-300 font-bold px-2";
                hint.innerText = "这个一级分类还没有子类，也可以直接记录。";
                l2Box.appendChild(hint);
            }
        }

        let lastSecondTs = 0;
        function tick() {
            const now = Date.now();
            const d = new Date(now + BJ_OFFSET);
            const secAngle = (d.getUTCSeconds() + d.getUTCMilliseconds() / 1000) * 6; // 每秒6度

            // 60M 时钟
            const hourStart = beijingPeriodStart(now, HOUR_MS);
            const hourEnd = hourStart + HOUR_MS;
            const angle60 = ((now - hourStart) / HOUR_MS) * 360;
            const hand60 = document.getElementById('hand-60m');
            if (hand60) hand60.style.transform = `rotate(${angle60}deg)`;
            const sec60 = document.getElementById('second-60m');
            if (sec60) sec60.style.transform = `rotate(${secAngle}deg)`;

            // 24H 时钟
            const dayStart = beijingPeriodStart(now, DAY_MS);
            const dayEnd = dayStart + DAY_MS;
            const angle24 = ((now - dayStart) / DAY_MS) * 360;
            const hand24 = document.getElementById('hand-24h');
            if (hand24) hand24.style.transform = `rotate(${angle24}deg)`;
            const sec24 = document.getElementById('second-24h');
            if (sec24) sec24.style.transform = `rotate(${secAngle}deg)`;

            // 中心文字（每帧更新）
            const hourRemain = Math.ceil((hourEnd - now) / 60000);
            setText('label-60m-remain', hourRemain);
            const dayRemainMs = Math.max(0, dayEnd - now);
            const dayRemainH = Math.floor(dayRemainMs / HOUR_MS);
            const dayRemainM = Math.floor((dayRemainMs % HOUR_MS) / 60000);
            setText('label-24h-remain', `${String(dayRemainH).padStart(2,'0')}:${String(dayRemainM).padStart(2,'0')}`);

            // 计时器
            if (current) {
                const diff = now - current.startTime;
                const el = document.getElementById('header-timer');
                if (el) el.innerText = formatDuration(diff);
            }
            renderDayRemain();

            if(current) {
                document.getElementById('status-light').className = "w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse";
                setText('header-l2', displayName(current));
                setText('header-memo', current.note || "");
                setText('report-cur-l2', displayName(current));
                setText('report-cur-timer', formatDuration(now - current.startTime));
            } else {
                setText('header-l2', "等待开启...");
                setText('header-memo', "");
                setText('report-cur-l2', "空闲");
                setText('report-cur-timer', "00:00:00");
            }

            // 每秒才重建 SVG（避免每帧重建导致卡顿）
            const sec = Math.floor(now / 1000);
            if (sec !== lastSecondTs) {
                lastSecondTs = sec;
                updateUI();
                renderReport();
            }
        }

        function renderDayRemain() {
            const now = Date.now();
            const dayStart = beijingPeriodStart(now, DAY_MS);
            const elapsed = Math.min(DAY_MS, Math.max(0, now - dayStart));
            const remain = Math.max(0, DAY_MS - elapsed);
            const remainPct = (remain / DAY_MS) * 100;
            const fill = document.getElementById('day-remain-fill');
            if (!fill) return;
            fill.style.width = `${remainPct}%`;
            setText('day-remain-label', `今天剩余 ${Math.round(remainPct)}%`);
        }

        function updateUI() {
            const now = Date.now();
            const nowDate = new Date(now + BJ_OFFSET);
            renderFlow();
            const inner = document.getElementById('report-inner-ring');
            if(inner) inner.setAttribute('stroke-dasharray', `${((nowDate.getUTCMinutes()*60+nowDate.getUTCSeconds())/3600)*239} 239`);
            const outer = document.getElementById('report-outer-segments');
            if(outer) {
                outer.innerHTML = "";
                const dayStart = beijingPeriodStart(now, DAY_MS);
                const dayEnd = dayStart + DAY_MS;
                const todayLogs = logs
                    .map(l => ({ ...l, endTime: l.endTime || l.startTime }))
                    .filter(l => l.endTime > dayStart && l.startTime < dayEnd);
                if(current) todayLogs.unshift({...current, endTime: Date.now()});
                todayLogs.forEach(log => {
                    const start = Math.max(log.startTime, dayStart);
                    const end = Math.min(log.endTime, dayEnd);
                    if (end <= start) return;
                    const s = ((start - dayStart) / (dayEnd - dayStart)) * 360;
                    const e = ((end - dayStart) / (dayEnd - dayStart)) * 360;
                    const c = log.color || cats.find(c=>c.name===log.l1)?.color || "#cbd5e1";
                    const seg = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                    seg.setAttribute("cx","60"); seg.setAttribute("cy","60"); seg.setAttribute("r","50");
                    seg.setAttribute("stroke",c); seg.setAttribute("class","segment");
                    seg.setAttribute("stroke-dasharray", `${((e-s)/360)*314} 314`);
                    seg.setAttribute("stroke-dashoffset", -(s/360)*314);
                    outer.appendChild(seg);
                });
            }
        }

        function applyFontSize() {
            labelFontSize = parseInt(document.getElementById('fontsize-slider').value) || 13;
            localStorage.setItem('v9_labelFontSize', labelFontSize);
            document.getElementById('fontsize-value').innerText = labelFontSize + 'px';
            renderAll();
        }
        window.addEventListener('load', () => {
            const slider = document.getElementById('fontsize-slider');
            if (slider) {
                slider.value = labelFontSize;
                slider.addEventListener('input', applyFontSize);
            }
        });

        function renderFlow() {
            const now = Date.now();
            const dayStart = beijingPeriodStart(now, DAY_MS);
            const dayEnd = dayStart + DAY_MS;
            const hourStart = beijingPeriodStart(now, HOUR_MS);
            const hourEnd = hourStart + HOUR_MS;
            const g60 = document.getElementById('svg-60m');
            const g24 = document.getElementById('svg-24h');
            const hand60 = document.getElementById('hand-60m');
            const hand24 = document.getElementById('hand-24h');
            if (!g60 || !g24) return;

            g60.innerHTML = "";
            g24.innerHTML = "";
            render24hMarks();

            const currentLog = current ? { ...current, endTime: now, live: true } : null;
            const all = logs
                .map(l => ({ ...l, endTime: l.endTime || l.startTime }))
                .concat(currentLog ? [currentLog] : [])
                .filter(Boolean);
            const dayLogs = all.filter(l => l.endTime > dayStart && l.startTime < dayEnd);
            const hourLogs = dayLogs.filter(l => l.endTime > hourStart && l.startTime < hourEnd);
            const totalMs = dayLogs.reduce((sum, l) => {
                const start = Math.max(l.startTime, dayStart);
                const end = Math.min(l.endTime, dayEnd);
                return sum + Math.max(0, end - start);
            }, 0);

            hourLogs.forEach(log => {
                const color = log.color || getCat(log.l1)?.color || "#cbd5e1";
                drawClockSegment(g60, 50, log.startTime, log.endTime, hourStart, hourEnd, color, log);
            });

            dayLogs.forEach(log => {
                const color = log.color || getCat(log.l1)?.color || "#cbd5e1";
                drawClockSegment(g24, 50, log.startTime, log.endTime, dayStart, dayEnd, color, log);
            });

            const hourRemain = Math.ceil((hourEnd - now) / 60000);
            setText('label-60m-remain', hourRemain);
            const angle60 = ((now - hourStart) / HOUR_MS) * 360;
            const angle24 = ((now - dayStart) / DAY_MS) * 360;
            hand60.style.transform = `translateX(-50%) rotate(${angle60}deg)`;
            hand24.style.transform = `translateX(-50%) rotate(${angle24}deg)`;

            // 标签已移除（保持时钟干净）
        }

        // --- 辅助 ---
        function switchTab(t) {
            pickerMode = 'record';
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById('page-'+t).classList.add('active');
            ['record', 'report'].forEach(name => {
                const nav = document.getElementById('nav-' + name);
                if (nav) {
                    nav.classList.remove('text-indigo-600');
                    nav.classList.add('text-slate-400');
                }
            });
            const btn = document.getElementById('nav-'+t); if(btn) btn.classList.replace('text-slate-400','text-indigo-600');
        }
        function closeDrawer() { document.getElementById('drawer').classList.add('hidden'); pickerMode = 'record'; }
        function handleFreeInput() {
            const el = document.getElementById('free-input'); const val = el.value.trim(); if(!val) return;
            const matches = [];
            cats.forEach(c => c.subs.forEach(s => {
                const index = val.indexOf(s);
                if (index >= 0) matches.push({ l1: c.name, l2: s, index });
            }));
            cats.forEach(c => {
                const index = val.indexOf(c.name);
                if (index >= 0) matches.push({ l1: c.name, l2: "", index });
            });
            matches.sort((a, b) => a.index - b.index || b.l2.length - a.l2.length);
            const match = matches[0] || { l1: "", l2: "" };
            const tag = val.match(/#(\S+)/)?.[1] || "";
            executeRecord(match.l1, match.l2, tag, val); el.value = "";
        }
        function addL1() {
            showPrompt("新建一级分类", "输入大类名称", "", (n) => {
                if (n && n.trim()) {
                    cats.push({id:Date.now(), name:n.trim(), icon:"📁", color:"#94a3b8", subs: []});
                    save();
                }
            });
        }
        function addS(id) {
            showPrompt("新建子分类", "输入子类名称", "", (n) => {
                const cat = cats.find(c=>c.id==id);
                if (n && n.trim() && cat) {
                    cat.subs.push(n.trim());
                    save();
                }
            });
        }
        function editL1(id) {
            const cat = cats.find(c => c.id == id);
            if (!cat) return;
            const oldName = cat.name;
            showPrompt("编辑一级分类名称", "输入大类名称", cat.name, (name) => {
                if (!name || !name.trim()) return;
                cat.name = name.trim();
                shortcuts.forEach(s => { if (s.l1 === oldName) s.l1 = cat.name; });
                logs.forEach(l => { if (l.l1 === oldName) l.l1 = cat.name; });
                if (current?.l1 === oldName) current.l1 = cat.name;
                if (selL1 === oldName) selL1 = cat.name;
                showPrompt("编辑图标", "输入一个 Emoji", cat.icon || "📁", (icon) => {
                    if (icon && icon.trim()) cat.icon = icon.trim();
                    showPrompt("编辑颜色", "例如 #6366f1", cat.color || "#94a3b8", (color) => {
                        if (color && color.trim()) cat.color = color.trim();
                        saveAll();
                    });
                });
            });
        }
        function editS(id, oldName) {
            const cat = cats.find(c => c.id == id);
            if (!cat) return;
            showPrompt("编辑子分类", "输入新的子类名称", oldName, (name) => {
                if (name === null) return;
                const next = name.trim();
                if (!next) return;
                cat.subs = cat.subs.map(s => s === oldName ? next : s);
                shortcuts.forEach(s => { if (s.l1 === cat.name && s.l2 === oldName) s.l2 = next; });
                logs.forEach(l => { if (l.l1 === cat.name && l.l2 === oldName) l.l2 = next; });
                if (current?.l1 === cat.name && current?.l2 === oldName) current.l2 = next;
                saveAll();
            });
        }
        function delS(id, name) {
            const cat = cats.find(c => c.id == id);
            if (!cat) return;
            if (confirm(`删除子类「${name}」？`)) {
                cat.subs = cat.subs.filter(s => s !== name);
                shortcuts = shortcuts.filter(s => !(s.l1 === cat.name && s.l2 === name));
                saveAll();
            }
        }
        function delL1(id) {
            const cat = cats.find(c => c.id === id);
            if(confirm("删除？")) {
                cats = cats.filter(c=>c.id!==id);
                if (cat) shortcuts = shortcuts.filter(s => s.l1 !== cat.name);
                if (!cats.some(c => c.name === selL1)) selL1 = cats[0]?.name || "";
                saveAll();
            }
        }
        function save() { localStorage.setItem('v9_cats', JSON.stringify(cats)); renderAll(); }
        function saveAll() {
            localStorage.setItem('v9_cats', JSON.stringify(cats));
            localStorage.setItem('v9_shorts', JSON.stringify(shortcuts));
            localStorage.setItem('v9_logs', JSON.stringify(logs));
            if (current) localStorage.setItem('v9_current', JSON.stringify(current));
            renderAll();
        }
    </script>
