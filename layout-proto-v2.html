<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>布局示意 v2</title>
<style>
body{background:#f1f5f9;display:flex;justify-content:center;padding:40px;font-family:system-ui}
.phone{width:340px;background:#fff;border-radius:32px;padding:24px;box-shadow:0 8px 40px rgba(0,0,0,.08)}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:10px 13px;font-size:13px;font-weight:700;display:flex;flex-direction:column;align-items:center;min-width:50px}
.badge small{font-size:8px;color:#94a3b8;font-weight:400;margin-top:2px}
.badge-sm{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:6px 9px;font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;min-width:38px}
.badge-sm small{font-size:7px;color:#94a3b8;font-weight:400;margin-top:1px}
.vline{width:2px;height:18px;background:#cbd5e1;margin-left:18px}
.branch{display:flex;align-items:flex-end;gap:6px;margin-left:10px;margin-bottom:8px}
.branch-line{font-size:18px;color:#a78bfa;line-height:1;transform:translateY(4px)} /* ↳ */
.lbl{font-size:9px;font-weight:900;color:#94a3b8;margin-bottom:10px;letter-spacing:.05em}
.log-row{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #f8fafc;align-items:center}
.bar{width:5px;height:32px;border-radius:4px;background:#3b82f6;flex-shrink:0}
.bar-sm{width:4px;height:26px;border-radius:3px;flex-shrink:0}
.tag{font-size:8px;font-weight:900;color:#8b5cf6;background:#f5f3ff;padding:1px 6px;border-radius:999px;border:1px solid #ede9fe;display:inline-flex;align-items:center;gap:2px}
</style>
</head>
<body>
<div class="phone">

  <!-- ⭐ 快捷入口 -->
  <div class="lbl">⭐ 快捷入口</div>
  <div class="badges">
    <div class="badge">🚕<small>开网约</small></div>
    <div class="badge">🛌<small>睡觉</small></div>
    <div class="badge">🚗<small>开车</small></div>
    <div class="badge">🍜<small>吃饭</small></div>
    <div class="badge" style="border:1px dashed #cbd5e1;color:#94a3b8">＋<small>记一笔</small></div>
  </div>

  <!-- 转折线 + 缩进去的并行 -->
  <div class="vline"></div>
  <div class="branch">
    <span class="branch-line">↳</span>
    <div>
      <div style="font-size:8px;font-weight:900;color:#8b5cf6;margin-bottom:5px">并行快捷 · 实时 toggle</div>
      <div class="badges" style="margin-left:0">
        <div class="badge-sm">🚕<small>开网约</small></div>
        <div class="badge-sm">🛌<small>睡觉</small></div>
        <div class="badge-sm">🚗<small>开车</small></div>
        <div class="badge-sm">🍜<small>吃饭</small></div>
        <div class="badge-sm" style="border:1px dashed #cbd5e1;color:#94a3b8">＋<small>记一笔</small></div>
      </div>
    </div>
  </div>

  <hr style="border:none;border-top:1px solid #e2e8f0;margin:14px 0">

  <!-- 📋 今日流水 -->
  <div class="lbl">📋 今日流水</div>

  <!-- 主活动 -->
  <div class="log-row">
    <div class="bar"></div>
    <div style="flex:1">
      <div style="display:flex;font-weight:700;color:#334155;font-size:12px">
        <span style="font-family:monospace;font-size:11px;color:#94a3b8">08:30</span>
        <span style="margin-left:8px">💼 上班 / 办公</span>
        <span style="margin-left:auto;color:#4f46e5">175min</span>
      </div>
      <div style="color:#94a3b8;font-size:11px;margin-top:2px;display:flex;align-items:center;gap:6px">
        写周报
        <span class="tag">↳ 补录</span>
      </div>
    </div>
  </div>

  <!-- 并行子条目（↳ 统一视觉） -->
  <div style="margin-left:14px;padding-left:12px;border-left:2px dashed #ddd;margin-bottom:4px">
    <div class="log-row" style="border:none;padding:6px 0">
      <div class="bar-sm" style="background:#10b981"></div>
      <div style="flex:1">
        <div style="display:flex;font-weight:700;color:#334155;font-size:11px">
          <span style="color:#8b5cf6;font-size:10px;margin-right:4px">↳</span>
          <span style="font-family:monospace;font-size:10px;color:#94a3b8">09:15</span>
          <span style="margin-left:6px">🍜 吃饭</span>
          <span style="margin-left:auto;color:#10b981;font-size:11px">30min</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 又一条并行 -->
  <div style="margin-left:14px;padding-left:12px;border-left:2px dashed #ddd">
    <div class="log-row" style="border:none;padding:6px 0">
      <div class="bar-sm" style="background:#ef4444"></div>
      <div style="flex:1">
        <div style="display:flex;font-weight:700;color:#334155;font-size:11px">
          <span style="color:#8b5cf6;font-size:10px;margin-right:4px">↳</span>
          <span style="font-family:monospace;font-size:10px;color:#94a3b8">10:00</span>
          <span style="margin-left:6px">🚗 开车</span>
          <span style="margin-left:auto;color:#ef4444;font-size:11px">20min</span>
        </div>
      </div>
    </div>
  </div>

  <div style="font-size:9px;color:#94a3b8;text-align:center;margin-top:16px;padding:10px;background:#f8fafc;border-radius:12px">
    ⚡ 并行点一下 ↠ 开始 / 再点 ↠ 结束<br>
    ⏎ 补录弹抽屉调时间
  </div>

</div>
</body>
</html>
